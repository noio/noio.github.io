<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Garbage Country — Key Art</title>
    <style>
        :root {
            --bg: #1b2838;            /* steam store dark blue */
            --bg-deep: #16202d;
            --panel: #2a3f5a;
            --panel-hover: #35516f;
            --text: #c6d4df;
            --text-dim: #66798c;
            --accent: #66c0f4;        /* steam blue */
            --selected: #ffffff;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 220px);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* ---------- top bar ---------- */
        header {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
            padding: 14px 24px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(6px);
        }
        .brand {
            font-size: 12px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text-dim);
            white-space: nowrap;
        }
        .brand strong { color: var(--text); font-weight: 600; }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            justify-content: center;
            min-width: 280px;
        }

        /* ---------- branch dropdown ---------- */
        .dropdown { position: relative; }
        .dropdown-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel);
            color: var(--selected);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            padding: 8px 14px 8px 16px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: background 0.15s;
            min-width: 140px;
            justify-content: space-between;
        }
        .dropdown-btn:hover { background: var(--panel-hover); }
        .dropdown-btn svg {
            width: 12px; height: 12px;
            fill: var(--accent);
            transition: transform 0.15s;
            flex-shrink: 0;
        }
        .dropdown.open .dropdown-btn svg { transform: rotate(180deg); }
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            min-width: 100%;
            background: var(--bg-deep);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 3px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: none;
        }
        .dropdown.open .dropdown-menu { display: block; }
        .dropdown-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 18px;
            padding: 10px 16px;
            font-size: 15px;
            cursor: pointer;
            white-space: nowrap;
        }
        .dropdown-item:hover { background: var(--panel); color: var(--selected); }
        .dropdown-item.active { color: var(--accent); }
        .dropdown-item .count { font-size: 11px; color: var(--text-dim); }

        /* ---------- version strip ---------- */
        .versions {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .ver-arrow {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 6px;
            display: flex;
            border-radius: 3px;
            transition: color 0.15s, background 0.15s;
        }
        .ver-arrow:hover:not(:disabled) { color: var(--selected); background: rgba(255,255,255,0.06); }
        .ver-arrow:disabled { opacity: 0.25; cursor: default; }
        .ver-arrow svg { width: 16px; height: 16px; fill: currentColor; }
        .ver-pip {
            background: none;
            border: 1px solid transparent;
            border-radius: 3px;
            color: var(--text-dim);
            opacity: 0.55;
            font-size: 13px;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            padding: 5px 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .ver-pip:hover { opacity: 1; color: var(--text); }
        .ver-pip.active {
            opacity: 1;
            color: var(--selected);
            background: var(--panel);
            border-color: rgba(102, 192, 244, 0.5);
        }

        /* ---------- view toggle ---------- */
        .right-group { display: flex; align-items: center; gap: 10px; }
        .view-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .view-toggle button {
            display: flex;
            align-items: center;
            gap: 7px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: 0.5px;
            padding: 8px 14px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .view-toggle button svg { width: 15px; height: 15px; fill: currentColor; }
        .view-toggle button:hover { color: var(--text); }
        .view-toggle button.active {
            background: var(--panel);
            color: var(--selected);
        }
        .icon-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            color: var(--text-dim);
            padding: 8px;
            display: flex;
            cursor: pointer;
            transition: all 0.15s;
        }
        .icon-btn:hover { color: var(--selected); background: var(--panel); }
        .icon-btn svg { width: 15px; height: 15px; fill: currentColor; }

        /* ---------- full view ---------- */
        #full-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px 20px;
            min-height: calc(100vh - 70px);
        }
        #full-img {
            /* cap at native main-capsule width; (x2) exports stay retina-crisp */
            max-width: min(100%, 616px);
            max-height: calc(100vh - 170px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            border-radius: 2px;
        }
        .caption {
            margin-top: 16px;
            font-size: 12px;
            color: var(--text-dim);
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
        }

        /* ---------- store view ---------- */
        #store-view {
            display: none;
            padding: 40px 24px 64px;
        }
        .store-header {
            max-width: 1560px;
            margin: 0 auto 18px;
            font-size: 14px;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .capsule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 297px);
            gap: 14px;
            justify-content: center;
            max-width: 1580px;
            margin: 0 auto;
        }
        .capsule {
            width: 297px;
            text-decoration: none;
        }
        .capsule .img-wrap {
            width: 297px;
            height: 170px; /* main capsule 616×353 ratio, 5-up rows */
            overflow: hidden;
            border-radius: 2px;
            background: var(--bg-deep);
            transition: transform 0.12s;
        }
        .capsule:hover .img-wrap {
            transform: scale(1.02);
            outline: 1px solid rgba(255, 255, 255, 0.4);
        }
        .capsule img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .capsule .title {
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .capsule:hover .title { color: var(--selected); }

        /* ---------- list view ---------- */
        #list-view {
            display: none;
            padding: 40px 24px 64px;
        }
        .list-header {
            max-width: 720px;
            margin: 0 auto 14px;
            font-size: 14px;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .store-rows {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 10px 6px 6px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 2px;
            text-decoration: none;
            transition: background 0.12s;
        }
        .row:hover { background: var(--panel); }
        .row-cap {
            width: 231px;
            height: 87px;  /* steam homepage tab row capsule size */
            flex-shrink: 0;
            overflow: hidden;
            border-radius: 1px;
            background: var(--bg-deep);
        }
        .row-cap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .row-mid { flex: 1; min-width: 0; }
        .row-title {
            font-size: 14px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .row:hover .row-title { color: var(--selected); }
        .row-tags {
            margin-top: 4px;
            font-size: 11px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .row-right {
            text-align: right;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
        }
        .row-price {
            font-size: 13px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .row-price .orig {
            font-size: 11px;
            color: var(--text-dim);
            text-decoration: line-through;
        }
        .row-price .disc {
            background: #4c6b22;
            color: #a4d007;
            font-size: 12px;
            padding: 1px 4px;
            border-radius: 1px;
        }
        .row-released { font-size: 11px; color: var(--text-dim); }

        @media (max-width: 600px) {
            .row-tags { display: none; }
            .row-cap { width: 120px; height: 45px; }
        }

        /* ---------- misc ---------- */
        #empty-state {
            display: none;
            text-align: center;
            padding: 120px 24px;
            color: var(--text-dim);
            font-size: 15px;
            line-height: 1.8;
        }
        #empty-state code {
            background: rgba(0, 0, 0, 0.35);
            padding: 2px 8px;
            border-radius: 3px;
            color: var(--accent);
        }

        @media (max-width: 900px) {
            header { gap: 12px; padding: 12px; }
            .brand { display: none; }
            .capsule-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 297px)); }
            .capsule, .capsule .img-wrap { width: 100%; }
            .capsule .img-wrap { height: auto; aspect-ratio: 616 / 353; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand"><strong>Garbage Country</strong> &nbsp;·&nbsp; Key Art</div>

        <div class="nav-group">
            <div class="dropdown" id="branch-dropdown">
                <button class="dropdown-btn" id="branch-btn" aria-haspopup="listbox">
                    <span id="branch-label">—</span>
                    <svg viewBox="0 0 16 16"><path d="M8 11L2 5h12z"/></svg>
                </button>
                <div class="dropdown-menu" id="branch-menu" role="listbox"></div>
            </div>

            <div class="versions" id="versions">
                <button class="ver-arrow" id="prev-btn" title="Previous version (←)">
                    <svg viewBox="0 0 16 16"><path d="M10.5 2L4.5 8l6 6V2z"/></svg>
                </button>
                <span id="pips"></span>
                <button class="ver-arrow" id="next-btn" title="Next version (→)">
                    <svg viewBox="0 0 16 16"><path d="M5.5 2l6 6-6 6V2z"/></svg>
                </button>
            </div>
        </div>

        <div class="right-group">
            <div class="view-toggle" role="tablist">
                <button id="btn-full" title="Full resolution view">
                    <svg viewBox="0 0 16 16"><path d="M2 2h5v2H4v3H2V2zm12 0v5h-2V4h-3V2h5zM2 14V9h2v3h3v2H2zm12 0H9v-2h3V9h2v5z"/></svg>
                    FULL
                </button>
                <button id="btn-store" title="Steam store grid preview">
                    <svg viewBox="0 0 16 16"><path d="M1 2h6v4H1V2zm8 0h6v4H9V2zM1 8h6v4H1V8zm8 0h6v4H9V8z" transform="translate(0 1)"/></svg>
                    STORE
                </button>
                <button id="btn-list" title="New releases list preview">
                    <svg viewBox="0 0 16 16"><path d="M1 2h4v3H1V2zm5 .5h9v2H6v-2zM1 6.5h4v3H1v-3zm5 .5h9v2H6V7zM1 11h4v3H1v-3zm5 .5h9v2H6v-2z"/></svg>
                    LIST
                </button>
            </div>
            <button class="icon-btn" id="shuffle-btn" title="Reshuffle grid" style="display:none">
                <svg viewBox="0 0 16 16"><path d="M8 3a5 5 0 1 0 4.546 2.914l1.362-.636A6.5 6.5 0 1 1 8 1.5V0l4 2.5L8 5V3z"/></svg>
            </button>
        </div>
    </header>

    <div id="empty-state">
        No key art found.<br>
        Drop images into <code>art/&lt;BranchName&gt;/</code> and run <code>generate-catalog.py</code>.
    </div>

    <main id="full-view">
        <img id="full-img" alt="Key art">
        <div class="caption" id="full-caption"></div>
    </main>

    <main id="store-view">
        <div class="store-header">Popular Upcoming</div>
        <div class="capsule-grid" id="grid"></div>
    </main>

    <main id="list-view">
        <div class="list-header">New Releases</div>
        <div class="store-rows" id="rows"></div>
    </main>

    <script src="catalog-data.js"></script>
    <script src="store-list-data.js"></script>
    <script src="viewer.js"></script>
</body>
</html>
